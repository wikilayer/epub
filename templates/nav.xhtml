<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="{{ x .Book.Language }}" lang="{{ x .Book.Language }}">
<head>
  <title>{{ x .Book.ContentsTitle }}</title>
{{- with .Stylesheet }}
  <link rel="stylesheet" type="text/css" href="{{ . }}"/>
{{- end }}
</head>
<body>
  <nav epub:type="toc" id="toc">
    <h1>{{ x .Book.ContentsTitle }}</h1>
    {{ template "entries" .Tree }}
  </nav>
</body>
</html>
{{ define "entries" }}<ol>{{ range . }}<li><a href="{{ .File }}">{{ x .Title }}</a>{{ with .Children }}{{ template "entries" . }}{{ end }}</li>{{ end }}</ol>{{ end }}
